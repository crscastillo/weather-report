<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporte del clima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-up {
        animation: fade-up 0.35s ease-out both;
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900 antialiased pb-16">
    <div
      class="relative overflow-hidden bg-gradient-to-br from-indigo-600 to-cyan-500 px-4 pt-10 pb-16 text-center text-white"
    >
      <div
        class="pointer-events-none absolute -right-16 -top-16 h-56 w-56 rounded-full bg-white/10 blur-2xl"
      ></div>
      <div
        class="pointer-events-none absolute -bottom-20 -left-10 h-56 w-56 rounded-full bg-white/10 blur-2xl"
      ></div>
      <h1 class="relative text-2xl font-extrabold tracking-tight sm:text-3xl">
        Reporte del clima
      </h1>
      <p class="relative mx-auto mt-2 max-w-sm text-sm text-indigo-100">
        Agrega uno o mas lugares con su rango de fechas y genera el reporte
      </p>
    </div>

    <div class="mx-auto -mt-8 max-w-2xl px-4">
      <div
        id="summary-panel"
        class="hidden animate-fade-up rounded-2xl bg-white p-4 shadow-xl shadow-slate-200/70"
      >
        <div class="mb-3 flex items-center justify-between">
          <p class="text-base font-semibold">Tus lugares y fechas</p>
          <button
            type="button"
            id="edit-btn"
            class="flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1.5 text-xs font-medium text-indigo-700 transition hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          >
            <span>&#9998;</span> Editar
          </button>
        </div>
        <div id="summary-list" class="mb-4 flex flex-col gap-2.5"></div>
        <button
          type="button"
          id="summary-generate"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 px-4 py-3 text-sm font-semibold text-white shadow-md shadow-indigo-200 transition hover:brightness-105 active:scale-[0.98] disabled:cursor-default disabled:opacity-60"
        >
          Actualizar reporte
        </button>
      </div>

      <form
        id="weather-form"
        class="animate-fade-up rounded-2xl bg-white p-4 shadow-xl shadow-slate-200/70"
      >
        <div id="rows" class="mb-3 flex flex-col gap-3"></div>
        <button
          type="button"
          id="add-row"
          class="mb-3 w-full rounded-lg border border-dashed border-indigo-200 bg-white px-3 py-3 text-sm font-medium text-indigo-600 transition hover:bg-indigo-50 active:scale-[0.99]"
        >
          + Agregar lugar
        </button>
        <button
          type="submit"
          id="submit-btn"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 px-4 py-3 text-sm font-semibold text-white shadow-md shadow-indigo-200 transition hover:brightness-105 active:scale-[0.98] disabled:cursor-default disabled:from-slate-300 disabled:to-slate-300 disabled:shadow-none"
        >
          <span id="submit-btn-text">Generar reporte</span>
          <svg
            id="submit-spinner"
            class="hidden h-4 w-4 animate-spin"
            viewBox="0 0 24 24"
            fill="none"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            ></path>
          </svg>
        </button>
        <div
          id="status"
          class="mt-2 min-h-[18px] text-center text-xs text-slate-500"
        ></div>
      </form>

      <div id="report" class="mt-6"></div>
    </div>

    <div class="mx-auto mt-10 max-w-2xl px-4 text-center">
      <p
        class="mb-2.5 text-[11px] font-medium uppercase tracking-wide text-slate-400"
      >
        Fuentes de datos
      </p>
      <div class="flex flex-wrap justify-center gap-2.5">
        <a
          class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-500 transition hover:border-indigo-200 hover:shadow-sm"
          href="https://open-meteo.com"
          target="_blank"
          rel="noopener"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M17.5 18H6.5C4 18 2 16 2 13.5C2 11.2 3.7 9.3 5.9 9C6.6 6.1 9.2 4 12.2 4C15.8 4 18.7 6.9 18.7 10.5V10.9C20.6 11.3 22 13 22 15C22 16.7 21 18 17.5 18Z"
              stroke="#06b6d4"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
          <span class="font-semibold text-slate-700">Open-Meteo</span>
          &middot; clima y geocodificacion
        </a>
        <a
          class="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-500 transition hover:border-indigo-200 hover:shadow-sm"

          target="_blank"
          rel="noopener"
        >
          <svg

            height="14"
            viewBox="0 0 24 24"
            fill="none"

            <path
              d="M4 20V10M12 20V4M20 20V14"

    <!-- day detail drawer -->
    <div
      id="overlay"
      class="fixed inset-0 z-[100] flex invisible items-end justify-center bg-slate-900/50 opacity-0 backdrop-blur-sm transition-opacity duration-300"
    >
      <div
        id="drawer"
        class="w-full max-w-2xl translate-y-full max-h-[88vh] overflow-y-auto rounded-t-3xl bg-white p-5 pb-6 shadow-2xl transition-transform duration-300 ease-out"
      >
        <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-slate-200"></div>
        <div class="mb-1 flex items-start justify-between">
          <div class="flex items-center gap-3">
            <span id="drawer-icon" class="text-4xl leading-none"></span>
            <div>
              <p id="drawer-title" class="text-lg font-bold"></p>
              <p id="drawer-sub" class="text-sm text-slate-500"></p>
            </div>
          </div>
          <button
            id="drawer-close"
            class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-500 transition hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            aria-label="Cerrar"
          >
            &times;
          </button>
        </div>
        <div id="drawer-stats" class="mb-4 mt-4 grid grid-cols-2 gap-2.5"></div>
        <p
          class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-400"
        >
          Por hora
        </p>
        <div class="relative mb-4 h-[170px]">
          <canvas
            id="drawer-chart"
            role="img"
            aria-label="Temperatura y probabilidad de lluvia por hora"
          ></canvas>
        </div>
        <div
          class="rounded-xl border border-emerald-200 bg-emerald-50 p-3.5 text-sm leading-relaxed text-emerald-900"
        >
          <p
            class="mb-1.5 text-xs font-bold uppercase tracking-wide text-emerald-600"
          >
            Recomendacion del dia
          </p>
          <p id="drawer-reco" class="m-0"></p>
        </div>
      </div>
    </div>

    <!-- calendar date-range drawer -->
    <div
      id="cal-overlay"
      class="fixed inset-0 z-[100] flex invisible items-end justify-center bg-slate-900/50 opacity-0 backdrop-blur-sm transition-opacity duration-300"
    >
      <div
        id="cal-drawer"
        class="w-full max-w-2xl translate-y-full max-h-[88vh] overflow-y-auto rounded-t-3xl bg-white p-5 pb-6 shadow-2xl transition-transform duration-300 ease-out"
      >
        <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-slate-200"></div>
        <div class="mb-4 flex items-center justify-between">
          <p class="text-lg font-bold">Elige las fechas</p>
          <button
            id="cal-close"
            class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-slate-500 transition hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            aria-label="Cerrar"
          >
            &times;
          </button>
        </div>
        <div id="cal-presets" class="mb-4 flex flex-wrap gap-2"></div>
        <div class="mb-3 flex items-center justify-between">
          <button
            type="button"
            id="cal-prev"
            class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-slate-600 transition hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            aria-label="Mes anterior"
          >
            &lsaquo;
          </button>
          <span id="cal-month-label" class="text-sm font-semibold"></span>
          <button
            type="button"
            id="cal-next"
            class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 text-slate-600 transition hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            aria-label="Mes siguiente"
          >
            &rsaquo;
          </button>
        </div>
        <div
          id="cal-weekdays"
          class="mb-1 grid grid-cols-7 text-center text-[11px] font-medium uppercase text-slate-400"
        ></div>
        <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
        <p id="cal-summary" class="my-4 text-center text-sm text-slate-500">
          Toca el dia de inicio y luego el de fin
        </p>
        <div class="flex gap-2.5">
          <button
            type="button"
            id="cal-cancel"
            class="flex-1 rounded-xl bg-slate-100 py-3 text-sm font-semibold text-slate-500 transition hover:bg-slate-200"
          >
            Cancelar
          </button>
          <button
            type="button"
            id="cal-apply"
            disabled
            class="flex-1 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 py-3 text-sm font-semibold text-white transition disabled:from-slate-300 disabled:to-slate-300"
          >
            Aplicar
          </button>
        </div>
      </div>
    </div>

    <template id="row-template">
      <div
        class="row-card relative animate-fade-up rounded-xl border border-slate-200 bg-slate-50 p-4"
      >
        <button
          type="button"
          class="remove-btn absolute right-2.5 top-2.5 rounded-full p-1.5 text-slate-400 transition hover:bg-slate-200 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          title="Quitar"
          aria-label="Quitar lugar"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
        <div class="mb-2.5">
          <label class="mb-1 block text-xs font-medium text-slate-500"
            >Lugar</label
          >
          <div class="loc-wrap relative">
            <input
              type="text"
              class="loc-input w-full rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-[15px] text-slate-900 transition focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30"
              placeholder="Ej: Niagara Falls, NY"
              autocomplete="off"
              required
            />
            <div
              class="loc-suggestions absolute left-0 right-0 top-full z-20 mt-1 hidden max-h-56 overflow-y-auto rounded-lg border border-slate-200 bg-white shadow-lg"
            ></div>
          </div>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-slate-500"
            >Fechas</label
          >
          <button
            type="button"
            class="date-range-btn flex w-full items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-left text-[15px] text-slate-400 transition hover:border-indigo-300"
          >
            <span class="cal-emoji flex-shrink-0 text-base">&#128197;</span>
            <span class="date-range-text"></span>
          </button>
          <input type="hidden" class="start-input" />
          <input type="hidden" class="end-input" />
        </div>
      </div>
    </template>

    <script>
      const rowsEl = document.getElementById("rows");
      const rowTemplate = document.getElementById("row-template");
      const addRowBtn = document.getElementById("add-row");
      const form = document.getElementById("weather-form");
      const statusEl = document.getElementById("status");
      const reportEl = document.getElementById("report");
      const submitBtn = document.getElementById("submit-btn");
      const submitBtnText = document.getElementById("submit-btn-text");
      const submitSpinner = document.getElementById("submit-spinner");
      const overlay = document.getElementById("overlay");
      const drawerPanel = document.getElementById("drawer");
      const drawerClose = document.getElementById("drawer-close");

      const summaryPanel = document.getElementById("summary-panel");
      const summaryList = document.getElementById("summary-list");
      const editBtn = document.getElementById("edit-btn");
      const summaryGenerateBtn = document.getElementById("summary-generate");

      const calOverlay = document.getElementById("cal-overlay");
      const calDrawerPanel = document.getElementById("cal-drawer");
      const calClose = document.getElementById("cal-close");
      const calCancel = document.getElementById("cal-cancel");
      const calApply = document.getElementById("cal-apply");
      const calPrev = document.getElementById("cal-prev");
      const calNext = document.getElementById("cal-next");
      const calMonthLabel = document.getElementById("cal-month-label");
      const calWeekdaysEl = document.getElementById("cal-weekdays");
      const calGridEl = document.getElementById("cal-grid");
      const calSummaryEl = document.getElementById("cal-summary");
      const calPresetsEl = document.getElementById("cal-presets");

      const WEEKDAYS = ["dom", "lun", "mar", "mie", "jue", "vie", "sab"];
      const WEEKDAYS_SHORT = ["D", "L", "M", "M", "J", "V", "S"];
      const MONTHS = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre",
      ];
      const chartInstances = [];
      let drawerChartInstance = null;
      let blocksData = [];
      let calRowCard = null;
      let calViewDate = new Date();
      let calStart = null;
      let calEnd = null;

      // ---------- overlay helpers ----------

      function showOverlay(overlayEl, panelEl) {
        overlayEl.classList.remove("opacity-0", "invisible");
        panelEl.classList.remove("translate-y-full");
      }

      function hideOverlay(overlayEl, panelEl) {
        panelEl.classList.add("translate-y-full");
        overlayEl.classList.add("opacity-0", "invisible");
      }

      function setStatus(msg, isError) {
        statusEl.textContent = msg;
        statusEl.classList.toggle("text-red-600", !!isError);
        statusEl.classList.toggle("text-slate-500", !isError);
      }

      function setCookie(name, value, days) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie =
          name +
          "=" +
          encodeURIComponent(value) +
          "; expires=" +
          expires +
          "; path=/; SameSite=Lax";
      }

      function getCookie(name) {
        const match = document.cookie.match(
          new RegExp("(^| )" + name + "=([^;]+)"),
        );
        return match ? decodeURIComponent(match[2]) : null;
      }

      function toISO(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }

      function parseISO(str) {
        return new Date(str + "T00:00:00");
      }

      function todayStr() {
        return toISO(new Date());
      }

      function addDays(d, n) {
        const copy = new Date(d);
        copy.setDate(copy.getDate() + n);
        return copy;
      }

      function sameDay(a, b) {
        return (
          a &&
          b &&
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      function formatDate(dateStr) {
        const d = parseISO(dateStr);
        const weekday = WEEKDAYS[d.getDay()];
        return weekday + " " + d.getDate() + "/" + (d.getMonth() + 1);
      }

      function formatDateLong(dateStr) {
        const d = parseISO(dateStr);
        const weekday = WEEKDAYS[d.getDay()];
        return (
          weekday.charAt(0).toUpperCase() +
          weekday.slice(1) +
          " " +
          d.getDate() +
          "/" +
          (d.getMonth() + 1)
        );
      }

      function formatShort(d) {
        return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3);
      }

      // ---------- row management ----------

      function updateRowButtonLabel(card) {
        const btn = card.querySelector(".date-range-btn");
        const text = btn.querySelector(".date-range-text");
        const startVal = card.querySelector(".start-input").value;
        const endVal = card.querySelector(".end-input").value;
        if (startVal && endVal) {
          btn.classList.remove("text-slate-400");
          btn.classList.add("text-slate-900");
          if (startVal === endVal) {
            text.textContent = formatShort(parseISO(startVal));
          } else {
            text.textContent =
              formatShort(parseISO(startVal)) +
              " - " +
              formatShort(parseISO(endVal));
          }
        } else {
          btn.classList.add("text-slate-400");
          btn.classList.remove("text-slate-900");
          text.textContent = "Selecciona fechas";
        }
      }

      function formatSuggestionLabel(r) {
        return r.name + (r.admin1 ? ", " + r.admin1 : "") + ", " + r.country;
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      async function fetchSuggestions(query) {
        if (!query || query.trim().length < 2) return [];
        const url =
          "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(query.trim()) +
          "&count=5&language=es&format=json";
        try {
          const res = await fetch(url);
          const data = await res.json();
          return data.results || [];
        } catch (e) {
          return [];
        }
      }

      function attachAutocomplete(locInput, box) {
        let debounceTimer;
        let lastQuery = "";
        let currentResults = [];

        function closeBox() {
          box.classList.add("hidden");
        }

        function renderResults(results) {
          currentResults = results;
          if (results.length === 0) {
            box.innerHTML = "";
            closeBox();
            return;
          }
          box.innerHTML = results
            .map((r) => {
              const sub = [r.admin1, r.country].filter(Boolean).join(", ");
              return (
                '<div class="loc-suggestion cursor-pointer border-b border-slate-100 px-3 py-2.5 text-sm text-slate-700 transition last:border-b-0 hover:bg-indigo-50">' +
                "<div>" +
                escapeHtml(r.name) +
                "</div>" +
                (sub
                  ? '<div class="mt-0.5 text-xs text-slate-400">' +
                    escapeHtml(sub) +
                    "</div>"
                  : "") +
                "</div>"
              );
            })
            .join("");
          box.classList.remove("hidden");
          Array.from(box.children).forEach((el, idx) => {
            el.addEventListener("mousedown", (e) => {
              e.preventDefault();
              locInput.value = formatSuggestionLabel(currentResults[idx]);
              box.innerHTML = "";
              closeBox();
            });
          });
        }

        locInput.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          const query = locInput.value;
          debounceTimer = setTimeout(async () => {
            if (query === lastQuery) return;
            lastQuery = query;
            const results = await fetchSuggestions(query);
            renderResults(results);
          }, 300);
        });

        locInput.addEventListener("focus", () => {
          if (currentResults.length > 0) box.classList.remove("hidden");
        });

        locInput.addEventListener("blur", () => {
          setTimeout(closeBox, 150);
        });

        locInput.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeBox();
        });
      }

      function addRow(data) {
        const node = rowTemplate.content.cloneNode(true);
        const card = node.querySelector(".row-card");
        const locInput = node.querySelector(".loc-input");
        const startInput = node.querySelector(".start-input");
        const endInput = node.querySelector(".end-input");
        const removeBtn = node.querySelector(".remove-btn");
        const rangeBtn = node.querySelector(".date-range-btn");
        const suggestionsBox = node.querySelector(".loc-suggestions");

        locInput.value = (data && data.location) || "";
        startInput.value = (data && data.start) || "";
        endInput.value = (data && data.end) || "";

        attachAutocomplete(locInput, suggestionsBox);

        removeBtn.addEventListener("click", () => {
          if (rowsEl.children.length > 1) card.remove();
        });

        rangeBtn.addEventListener("click", () => openCalendar(card));

        rowsEl.appendChild(node);
        updateRowButtonLabel(rowsEl.lastElementChild);
      }

      addRowBtn.addEventListener("click", () => addRow());

      function loadSavedEntries() {
        const saved = getCookie("wr_entries");
        if (saved) {
          try {
            const entries = JSON.parse(saved);
            if (Array.isArray(entries) && entries.length > 0) {
              entries.forEach((e) => addRow(e));
              return true;
            }
          } catch (e) {
            /* ignore malformed cookie */
          }
        }
        addRow();
        return false;
      }

      // ---------- collapsed summary panel ----------

      function renderSummaryList() {
        const cards = Array.from(rowsEl.querySelectorAll(".row-card"));
        const items = cards.map((card) => {
          const loc =
            card.querySelector(".loc-input").value.trim() || "Sin nombre";
          const startVal = card.querySelector(".start-input").value;
          const endVal = card.querySelector(".end-input").value;

                : formatShort(parseISO(startVal)) +
                  " - " +
                  formatShort(parseISO(endVal));
          }
          return { loc, dates, startVal: startVal || "9999-99-99" };
        });
        items.sort((a, b) => {

      function openCalendar(card) {
        calRowCard = card;
        const startVal = card.querySelector(".start-input").value;
        const endVal = card.querySelector(".end-input").value;
        calStart = startVal ? parseISO(startVal) : null;
        calEnd = endVal ? parseISO(endVal) : null;
        calViewDate = calStart ? new Date(calStart) : new Date();
        renderCalendar();
        showOverlay(calOverlay, calDrawerPanel);
      }

      function closeCalendar() {
        hideOverlay(calOverlay, calDrawerPanel);

      function renderCalendar() {
        calMonthLabel.textContent =
          MONTHS[calViewDate.getMonth()].charAt(0).toUpperCase() +
          MONTHS[calViewDate.getMonth()].slice(1) +
          " " +
          calViewDate.getFullYear();

        const year = calViewDate.getFullYear();
        const month = calViewDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const startOffset = firstDay.getDay();
        const today = new Date();

        calGridEl.innerHTML = "";
        for (let i = 0; i < startOffset; i++) {
          const empty = document.createElement("div");
          empty.className = "aspect-square";
          calGridEl.appendChild(empty);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const date = new Date(year, month, d);
          const isToday = sameDay(date, today);
          const inRange =
            calStart && calEnd && date >= calStart && date <= calEnd;
          const isStart = calStart && sameDay(date, calStart);
          const isEnd = calEnd && sameDay(date, calEnd);

          const btn = document.createElement("button");
          btn.type = "button";
          const outerClasses = [
            "relative",
            "aspect-square",
            "flex",
            "items-center",
            "justify-center",
            "cursor-pointer",
            "transition-colors",
          ];
          if (inRange) {
            outerClasses.push("bg-indigo-50");
            outerClasses.push(isStart ? "rounded-l-full" : "rounded-l-none");
            outerClasses.push(isEnd ? "rounded-r-full" : "rounded-r-none");
            if (!isStart && !isEnd) outerClasses.push("hover:bg-indigo-100");
          } else {
            outerClasses.push("rounded-full", "hover:bg-slate-100");
          }
          btn.className = outerClasses.join(" ");

          const num = document.createElement("span");
          const numClasses = [
            "flex",
            "h-full",
            "w-full",
            "items-center",
            "justify-center",
            "rounded-full",
            "text-sm",
          ];
          if (isStart || isEnd) {
            numClasses.push("bg-indigo-600", "font-semibold", "text-white");
          } else if (isToday) {
            numClasses.push("font-bold", "text-indigo-600");
          } else {
            numClasses.push("text-slate-700");
          }
          num.className = numClasses.join(" ");
          num.textContent = d;
          btn.appendChild(num);

          btn.addEventListener("click", () => handleDayClick(date));
          calGridEl.appendChild(btn);
        }

        if (calStart && calEnd) {
          calSummaryEl.innerHTML =
            '<strong class="text-slate-900">' +
            formatShort(calStart) +
            '</strong> a <strong class="text-slate-900">' +
            formatShort(calEnd) +
            "</strong>";
          calApply.disabled = false;
        } else if (calStart) {
          calSummaryEl.innerHTML =
            'Inicio: <strong class="text-slate-900">' +
            formatShort(calStart) +
            "</strong>. Toca el dia de fin.";
          calApply.disabled = true;
        } else {
          calSummaryEl.textContent = "Toca el dia de inicio y luego el de fin";
          calApply.disabled = true;
        }
      }

      function handleDayClick(date) {
        if (!calStart || (calStart && calEnd)) {
          calStart = date;
          calEnd = null;
        } else if (date < calStart) {
          calEnd = calStart;
          calStart = date;
        } else {
          calEnd = date;
        }
        renderCalendar();
      }

      function applyCalendar() {
        if (!calStart || !calEnd || !calRowCard) {
          closeCalendar();
          return;
        }
        calRowCard.querySelector(".start-input").value = toISO(calStart);
        calRowCard.querySelector(".end-input").value = toISO(calEnd);
        updateRowButtonLabel(calRowCard);

      // ---------- weather icon + recommendation ----------

      function weatherIcon(prob) {
        if (prob >= 70) return "⛈️";
        if (prob >= 40) return "🌧️";
        if (prob >= 15) return "⛅";
        return "☀️";
      }

      function buildRecommendation(day) {
        const parts = [];
        const feelsMax = day.feelsMax;

        if (feelsMax <= 8)
          parts.push(
            "Hace bastante frio: abrigate con capas, chaqueta gruesa y gorro.",
          );
        else if (feelsMax <= 15)
          parts.push("Ambiente fresco: lleva chaqueta o sueter.");
        else if (feelsMax <= 24)
          parts.push("Clima agradable: ropa comoda de entretiempo.");
        else if (feelsMax <= 30)
          parts.push("Ambiente calido: ropa ligera y transpirable.");
        else
          parts.push(
            "Hace mucho calor: usa ropa muy ligera y mantente hidratado.",
          );

        if (day.prob >= 60)
          parts.push(
            "Alta probabilidad de lluvia, lleva paraguas o chaqueta impermeable.",
          );
        else if (day.prob >= 30)
          parts.push(
            "Podria llover en algun momento, considera llevar paraguas.",
          );

        if (day.wind >= 40) parts.push("Viento fuerte, un rompevientos ayuda.");

        if (day.uv >= 8)
          parts.push(
            "Indice UV muy alto: protector solar, gorra y busca sombra al mediodia.",
          );
        else if (day.uv >= 6)
          parts.push("Indice UV alto: usa protector solar.");

        return parts.join(" ");
      }

      // ---------- API ----------

      async function geocode(place) {
        const url =
          "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(place) +
          "&count=1&language=es&format=json";
        const res = await fetch(url);
        if (!res.ok) throw new Error("No se pudo buscar el lugar.");
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          throw new Error("No se encontro el lugar.");
        }
        return data.results[0];
      }

      async function fetchForecast(lat, lon, start, end) {
        const url =
          "https://api.open-meteo.com/v1/forecast?latitude=" +
          lat +
          "&longitude=" +
          lon +
          "&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min," +
          "precipitation_sum,precipitation_probability_max,wind_speed_10m_max,uv_index_max" +
          "&hourly=temperature_2m,precipitation_probability" +
          "&timezone=auto&start_date=" +
          start +
          "&end_date=" +
          end;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(
            data.reason || "No se pudo obtener el pronostico para esas fechas.",
          );
        }
        return data;
      }

      function computeStats(daily) {
        const maxes = daily.temperature_2m_max;
        const mins = daily.temperature_2m_min;
        const probs = daily.precipitation_probability_max.map((p) =>
          p == null ? 0 : p,
        );
        const mms = daily.precipitation_sum.map((m) => (m == null ? 0 : m));
        const avgMax = maxes.reduce((a, b) => a + b, 0) / maxes.length;
        const avgMin = mins.reduce((a, b) => a + b, 0) / mins.length;
        const totalMm = mms.reduce((a, b) => a + b, 0);
        const rainyDays = probs.filter((p) => p >= 50).length;
        return {
          avgMax: Math.round(avgMax),
          avgMin: Math.round(avgMin),
          totalMm: totalMm.toFixed(1),
          rainyDays,
        };
      }

      function dayFromDaily(daily, i) {
        return {
          date: daily.time[i],
          max: Math.round(daily.temperature_2m_max[i]),
          min: Math.round(daily.temperature_2m_min[i]),
          feelsMax:
            daily.apparent_temperature_max[i] != null
              ? Math.round(daily.apparent_temperature_max[i])
              : Math.round(daily.temperature_2m_max[i]),
          feelsMin:
            daily.apparent_temperature_min[i] != null
              ? Math.round(daily.apparent_temperature_min[i])
              : Math.round(daily.temperature_2m_min[i]),
          prob:
            daily.precipitation_probability_max[i] != null
              ? Math.round(daily.precipitation_probability_max[i])
              : 0,
          mm:
            daily.precipitation_sum[i] != null
              ? daily.precipitation_sum[i].toFixed(1)
              : "0.0",
          wind:
            daily.wind_speed_10m_max[i] != null
              ? Math.round(daily.wind_speed_10m_max[i])
              : 0,
          uv:
            daily.uv_index_max[i] != null
              ? Math.round(daily.uv_index_max[i])
              : 0,
        };
      }

      function hourlyForDate(hourly, dateStr) {
        const hours = [];
        const temps = [];
        const probs = [];
        for (let i = 0; i < hourly.time.length; i++) {
          if (hourly.time[i].slice(0, 10) === dateStr) {
            hours.push(hourly.time[i].slice(11, 13) + "h");
            temps.push(hourly.temperature_2m[i]);
            probs.push(
              hourly.precipitation_probability[i] != null
                ? hourly.precipitation_probability[i]
                : 0,
            );
          }
        }
        return { hours, temps, probs };
      }

        chartInstances.push(chart);

        block.querySelector(".chart-legend").innerHTML =
          '<span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-amber-500"></span>Maxima</span>' +
          '<span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-indigo-600"></span>Minima</span>' +
          '<span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-blue-500/50"></span>Prob. lluvia</span>';

        return block;
      }

      function buildErrorBlock(entry, message) {
        const block = document.createElement("div");
        block.className =
          "loc-block mb-5 animate-fade-up rounded-2xl bg-white p-4 shadow-xl shadow-slate-200/70";
        block.innerHTML =
          '<p class="text-lg font-bold">' +
          entry.location +
          "</p>" +
          '<p class="mt-1 text-sm text-red-600">' +
          message +
          "</p>";
        return block;
      }

      function collectEntries() {
        const cards = Array.from(rowsEl.querySelectorAll(".row-card"));
        return cards
          .map((card) => ({
            location: card.querySelector(".loc-input").value.trim(),
            start: card.querySelector(".start-input").value,
            end: card.querySelector(".end-input").value,
          }))
          .filter((e) => e.location && e.start && e.end);
      }

      async function generateReport(e) {
        if (e) e.preventDefault();
        const entries = collectEntries();
        if (entries.length === 0) {
          setStatus("Agrega al menos un lugar con sus fechas.", true);
          return;
        }

        entries.sort((a, b) => {
          if (a.start !== b.start) return a.start.localeCompare(b.start);
          return a.location.localeCompare(b.location, "es");
        });

        setCookie("wr_entries", JSON.stringify(entries), 365);

        setStatus("Generando reporte...", false);
        submitBtn.disabled = true;
        summaryGenerateBtn.disabled = true;
        submitBtnText.textContent = "Generando...";
        submitSpinner.classList.remove("hidden");
        summaryGenerateBtn.textContent = "Generando...";

        chartInstances.forEach((c) => c.destroy());
        chartInstances.length = 0;
        if (drawerChartInstance) {
          drawerChartInstance.destroy();
          drawerChartInstance = null;
        }
        blocksData = [];
        closeDrawer();

        reportEl.innerHTML = "";
        entries.forEach(() => reportEl.appendChild(skeletonBlock()));

        let i = 0;
        for (const entry of entries) {
          const placeholder = reportEl.children[i];
          try {
            const geo = await geocode(entry.location);
            const forecast = await fetchForecast(
              geo.latitude,
              geo.longitude,
              entry.start,
              entry.end,
            );
            placeholder.replaceWith(buildBlock(entry, geo, forecast, i));
          } catch (err) {
            placeholder.replaceWith(
              buildErrorBlock(entry, err.message || "Ocurrio un error."),
            );
          }
          i++;
        }

        setStatus("", false);
        submitBtn.disabled = false;
        summaryGenerateBtn.disabled = false;
        submitBtnText.textContent = "Generar reporte";
        submitSpinner.classList.add("hidden");
        summaryGenerateBtn.textContent = "Actualizar reporte";
        showSummary();
      }

      form.addEventListener("submit", generateReport);

      const hadSavedEntries = loadSavedEntries();
      if (hadSavedEntries) {
        showSummary();
        generateReport();
      }
    </script>
  </body>
</html>
